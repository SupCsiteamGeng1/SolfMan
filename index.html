<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SolfMan - Beta 0.009</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(180deg, #050510 0%, #0a0a22 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }
  canvas {
    border: 6px solid #1a1a3a;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(68, 136, 255, 0.4), inset 0 0 20px rgba(0,0,0,0.5);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0a0a1a;
  }
  #hud-container {
    margin-top: 12px;
    display: flex;
    gap: 30px;
    align-items: center;
    background: rgba(10,10,30,0.8);
    padding: 8px 20px;
    border: 2px solid #334;
    border-radius: 4px;
  }
  #info {
    font-size: 13px;
    letter-spacing: 1px;
  }
  #controls {
    font-size: 11px;
    color: #88aaff;
    text-align: center;
  }
  .mobile-controls {
    display: none;
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    justify-content: space-between;
    padding: 0 10px;
    pointer-events: none;
    z-index: 10;
  }
  .mobile-controls button {
    pointer-events: auto;
    width: 60px;
    height: 60px;
    background: rgba(30,40,80,0.7);
    border: 2px solid #6688cc;
    border-radius: 12px;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    touch-action: none;
    user-select: none;
  }
  .mobile-controls button:active {
    background: rgba(80,120,200,0.9);
  }
  @media (max-width: 800px) {
    .mobile-controls { display: flex; }
    #controls { display: none; }
    canvas { max-width: 100vw; height: auto; }
  }
  .key {
    background: #223;
    border: 1px solid #446;
    padding: 1px 5px;
    border-radius: 2px;
    color: #ffdd44;
  }
</style>
</head>
<body>
<canvas id="game" width="320" height="180"></canvas>
<div id="hud-container">
  <div id="info">HP: <span id="hp">28</span> | BOSS: <span id="bhp">--</span></div>
  <div id="controls">
    <span class="key">←→</span> เดิน 
    <span class="key">↑/Space</span> กระโดด 
    <span class="key">Z</span> ยิง 1 นัด 
    <span class="key">X</span> ยิง 3 นัด 
    <span class="key">R</span> เริ่มใหม่
  </div>
</div>
<div class="mobile-controls">
  <div>
    <button id="btn-left">◀</button>
    <button id="btn-right">▶</button>
  </div>
  <div>
    <button id="btn-jump">↑</button>
    <button id="btn-z">1</button>
    <button id="btn-x">3</button>
  </div>
</div>

        (x > 2300 && x < 2340)) continue;
    platforms.push({ x, y: groundY, w: 32, h: 30 });
  }

  // Raised platforms (เพิ่มมากขึ้น)
  const raised = [
    {x: 160, y: 115, w: 80, h: 16},
    {x: 300, y: 95, w: 48, h: 16},
    {x: 420, y: 120, w: 96, h: 16},
    {x: 620, y: 85, w: 64, h: 16},
    {x: 740, y: 70, w: 48, h: 16},
    {x: 860, y: 110, w: 112, h: 16},
    {x: 1040, y: 90, w: 64, h: 16},
    {x: 1160, y: 120, w: 80, h: 16},
    {x: 1320, y: 75, w: 48, h: 16},
    {x: 1480, y: 105, w: 96, h: 16},
    {x: 1650, y: 85, w: 64, h: 16},
    {x: 1800, y: 115, w: 80, h: 16},
    {x: 1980, y: 70, w: 48, h: 16},
    {x: 2100, y: 100, w: 96, h: 16},
    {x: 2300, y: 90, w: 64, h: 16},
    {x: 2450, y: 120, w: 80, h: 16}
  ];
  raised.forEach(p => platforms.push(p));

  // Boss arena (ยาวหน่อย)
  for (let x = STAGE_END - 180; x < STAGE_END + 120; x += 32) {
    platforms.push({ x, y: groundY, w: 32, h: 30 });
  }
}

    weak: { ox: 11, oy: 9, w: 18, h: 14 }
  });
}

function resetGame() {
  player.x = 40;
  player.y = 100;
  player.vx = 0;
  player.vy = 0;
  player.health = 28;
  player.invincible = 0;
  player.singleTimer = 0;
  player.tripleTimer = 0;
  bullets = [];
  particles = [];
  gameOver = false;
  gameWon = false;
  buildLevel();
  spawnEnemies();
}

// Input
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'r' || e.key === 'R') resetGame();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// Mobile touch controls (improved)
function bindTouch(btnId, keyName) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  const setKey = (val) => { keys[keyName] = val; };
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); setKey(true); }, {passive: false});
  btn.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); setKey(false); }, {passive: false});
  btn.addEventListener('touchcancel', (e) => { e.preventDefault(); setKey(false); }, {passive: false});
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); setKey(true); });
  btn.addEventListener('pointerup', (e) => { e.preventDefault(); setKey(false); });
  btn.addEventListener('pointerleave', (e) => { setKey(false); });
}
bindTouch('btn-left', 'arrowleft');
bindTouch('btn-right', 'arrowright');
bindTouch('btn-jump', ' ');
bindTouch('btn-z', 'z');
bindTouch('btn-x', 'x');

// Prevent page scroll on mobile
document.body.addEventListener('touchmove', (e) => { e.preventDefault(); }, {passive: false});

function shootSingle() {
  if (player.singleTimer > 0 || gameOver || gameWon) return;
  bullets.push({
    x: player.x + (player.facing > 0 ? player.w : -6),
    y: player.y + 8,
    vx: player.facing * 4.8,
    vy: 0,
    w: 6, h: 4,
    fromPlayer: true,
    type: 'single'
  });
  player.singleTimer = SINGLE_COOLDOWN;
}

function shootTriple() {
  if (player.tripleTimer > 0 || gameOver || gameWon) return;
  const baseX = player.x + (player.facing > 0 ? player.w : -6);
  const baseY = player.y + 8;
  const dir = player.facing;
  // 3 นัด กระจายเล็กน้อย
  bullets.push({ x: baseX, y: baseY - 3, vx: dir * 4.5, vy: -0.6, w: 5, h: 3, fromPlayer: true, type: 'triple' });
  bullets.push({ x: baseX, y: baseY,     vx: dir * 4.8, vy: 0,    w: 6, h: 4, fromPlayer: true, type: 'triple' });
  bullets.push({ x: baseX, y: baseY + 3, vx: dir * 4.5, vy: 0.6,  w: 5, h: 3, fromPlayer: true, type: 'triple' });
  player.tripleTimer = TRIPLE_COOLDOWN;
}

function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function getWeakZone(boss) {
  return {
    x: boss.x + boss.weak.ox,
    y: boss.y + boss.weak.oy,
    w: boss.weak.w,
    h: boss.weak.h
  };
}

function update() {
  if (gameOver || gameWon) return;

  // Movement
  player.vx = 0;
  if (keys['arrowleft'] || keys['a']) { player.vx = -MOVE_SPEED; player.facing = -1; }
  if (keys['arrowright'] || keys['d']) { player.vx = MOVE_SPEED; player.facing = 1; }

  if ((keys['arrowup'] || keys[' '] || keys['w']) && player.onGround) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
  }

  if (keys['z'] && player.singleTimer <= 0) shootSingle();
  if (keys['x'] && player.tripleTimer <= 0) shootTriple();

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // Platform collision
  player.onGround = false;
  for (const p of platforms) {
    if (rectCollide(player, p)) {
      if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 4) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vx > 0 && player.x + player.w - player.vx <= p.x + 2) {
        player.x = p.x - player.w;
      } else if (player.vx < 0 && player.x - player.vx >= p.x + p.w - 2) {
        player.x = p.x + p.w;
      }
    }
  }

  if (player.y > canvas.height + 30) player.health = 0;

  if (player.invincible > 0) player.invincible--;
  if (player.singleTimer > 0) player.singleTimer--;
  if (player.tripleTimer > 0) player.tripleTimer--;

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < scrollX - 60 || b.x > scrollX + canvas.width + 60) {
      bullets.splice(i, 1);
      continue;
    }

    for (const e of enemies) {
      if (!e.alive) continue;

      let hit = false;
      if (e.type === 'boss') {
        // ต้องโดนจุดอ่อนเท่านั้น
        const weak = getWeakZone(e);
        if (rectCollide(b, weak)) {
          hit = true;
          e.hp -= (b.type === 'triple' ? 1 : 1);
          spawnParticles(weak.x + weak.w/2, weak.y + weak.h/2, '#ffff88', 8);
        }
      } else {
        if (rectCollide(b, e)) {
          hit = true;
          e.hp--;
          spawnParticles(b.x, b.y, '#ffff00');
        }
      }

      if (hit) {
        bullets.splice(i, 1);
        if (e.hp <= 0) {
          e.alive = false;
          spawnParticles(e.x + e.w/2, e.y + e.h/2, e.type === 'boss' ? '#ff66ff' : '#ff8800', 16);
          if (e.type === 'boss') {
            gameWon = true;
          }
        }
        break;
      }
    }
  }

  // Enemies
  for (const e of enemies) {
    if (!e.alive) continue;

    if (e.type === 'walker' || e.type === 'boss') {
      e.x += e.vx * e.dir;
      let onPlat = false;
      for (const p of platforms) {
        if (e.x + e.w/2 > p.x && e.x + e.w/2 < p.x + p.w && Math.abs(e.y + e.h - p.y) < 10) {
          onPlat = true;
          break;
        }
      }
      if (!onPlat || e.x < 20 || e.x > STAGE_END + 40) e.dir *= -1;
      if (e.type === 'boss' && Math.random() < 0.008) e.dir *= -1;
    } else if (e.type === 'flyer') {
      e.x += e.vx * e.dir;
      e.y += Math.sin(Date.now() / 280 + e.x * 0.01) * 0.35;
      if (e.x < scrollX - 20 || e.x > scrollX + 280) e.dir *= -1;
    }

    if ((e.type === 'shooter' || e.type === 'boss') && Math.abs(e.x - player.x) < 240) {
      e.shootTimer++;
      const rate = e.type === 'boss' ? 50 : 70;
      if (e.shootTimer > rate) {
        const dir = player.x > e.x ? 1 : -1;
        bullets.push({
          x: e.x + e.w/2,
          y: e.y + e.h/2,
          vx: dir * 3.2,
          vy: e.type === 'boss' ? (Math.random() - 0.5) * 2.2 : 0,
          w: 6, h: 4,
          fromPlayer: false
        });
        e.shootTimer = 0;
      }
    }

    if (player.invincible <= 0 && rectCollide(player, e)) {
      player.health -= e.type === 'boss' ? 4 : 2;
      player.invincible = INVINCIBLE_TIME;
      player.vx = (player.x < e.x ? -1 : 1) * 2.5;
      player.vy = -3.5;
      spawnParticles(player.x, player.y, '#ff5555');
    }
  }

  // Enemy bullets hit player
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (!b.fromPlayer && rectCollide(player, b) && player.invincible <= 0) {
      player.health -= 2;
      player.invincible = INVINCIBLE_TIME;
      bullets.splice(i, 1);
      spawnParticles(player.x, player.y, '#ff5555');
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Camera
  scrollX = Math.max(0, player.x - canvas.width / 2 + 30);
  const maxScroll = STAGE_END - canvas.width + 40;
  if (scrollX > maxScroll) scrollX = maxScroll;

  if (player.health <= 0) {
    player.health = 0;
    gameOver = true;
  }

  HP_SPAN.textContent = Math.max(0, player.health);
  const boss = enemies.find(e => e.type === 'boss');
  BHP_SPAN.textContent = boss && boss.alive ? boss.hp : (gameWon ? 'CLEAR' : '--');
}

function spawnParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 3.5,
      vy: (Math.random() - 0.5) * 3.5 - 0.8,
      life: 18 + Math.random() * 14,
      color
    });
  }
}

function draw() {
  // Background
  ctx.fillStyle = '#070718';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars (parallax)
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 53 + scrollX * 0.15) % (canvas.width + 20);
    const sy = (i * 29) % 70;
    ctx.fillRect(sx, sy, i % 5 === 0 ? 2 : 1, 1);
  }

  ctx.save();
  ctx.translate(-scrollX, 0);

  // Platforms (สวยขึ้นนิด)
  for (const p of platforms) {
    ctx.fillStyle = '#3a3a5a';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#5a5a8a';
    ctx.fillRect(p.x, p.y, p.w, 5);
    ctx.fillStyle = '#222244';
    ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
    // Pixel highlights
    ctx.fillStyle = '#6666aa';
    ctx.fillRect(p.x + 2, p.y + 2, 4, 2);
  }

  // Enemies — รายละเอียดพิกเซลมากขึ้น
  for (const e of enemies) {
    if (!e.alive) continue;
    const blink = Math.sin(Date.now() / 150 + e.x) > 0;

    if (e.type === 'boss') {
      // Body armor
      ctx.fillStyle = '#6a1a8a';
      ctx.fillRect(e.x, e.y + 8, e.w, e.h - 8);
      ctx.fillStyle = '#9922bb';
      ctx.fillRect(e.x + 2, e.y + 10, e.w - 4, e.h - 12);
      // Head
      ctx.fillStyle = '#cc44ee';
      ctx.fillRect(e.x + 6, e.y, e.w - 12, 14);
      ctx.fillStyle = '#ee88ff';
      ctx.fillRect(e.x + 8, e.y + 2, e.w - 16, 8);
      // Horns
      ctx.fillStyle = '#aa66dd';
      ctx.fillRect(e.x + 2, e.y + 2, 4, 6);
      ctx.fillRect(e.x + e.w - 6, e.y + 2, 4, 6);
      // Eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x + 10, e.y + 5, 6, 5);
      ctx.fillRect(e.x + 22, e.y + 5, 6, 5);
      ctx.fillStyle = blink ? '#ff2244' : '#aa0011';
      ctx.fillRect(e.x + 12, e.y + 6, 3, 3);
      ctx.fillRect(e.x + 24, e.y + 6, 3, 3);
      // Arms
      ctx.fillStyle = '#772299';
      ctx.fillRect(e.x - 4, e.y + 16, 6, 10);
      ctx.fillRect(e.x + e.w - 2, e.y + 16, 6, 10);
      // Legs
      ctx.fillStyle = '#551177';
      ctx.fillRect(e.x + 6, e.y + e.h - 8, 8, 8);
      ctx.fillRect(e.x + e.w - 14, e.y + e.h - 8, 8, 8);

      // Weak point (จุดอ่อนกะพริบชัด)
      const weak = getWeakZone(e);
      ctx.fillStyle = blink ? '#ffff66' : '#ffcc00';
      ctx.fillRect(weak.x, weak.y, weak.w, weak.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(weak.x + 5, weak.y + 4, 8, 6);
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(weak.x + 7, weak.y + 6, 4, 2);

      // Health bar
      ctx.fillStyle = '#111';
      ctx.fillRect(e.x - 4, e.y - 12, e.w + 8, 7);
      ctx.fillStyle = '#333';
      ctx.fillRect(e.x - 2, e.y - 10, e.w + 4, 5);
      ctx.fillStyle = '#ff3344';
      ctx.fillRect(e.x, e.y - 9, e.w * (e.hp / e.maxHp), 3);
    } else if (e.type === 'flyer') {
      // Floating spirit / hitodama yokai
      ctx.fillStyle = '#88ccff';
      ctx.globalAlpha = 0.7;
      ctx.fillRect(e.x + 1, e.y + 2, e.w - 2, e.h - 4);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#aaddff';
      ctx.fillRect(e.x + 3, e.y + 3, e.w - 6, 5);
      // Ghost face
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x + 4, e.y + 4, 2, 2);
      ctx.fillRect(e.x + 8, e.y + 4, 2, 2);
      ctx.fillStyle = '#113355';
      ctx.fillRect(e.x + 5, e.y + 5, 1, 1);
      ctx.fillRect(e.x + 9, e.y + 5, 1, 1);
      // Trailing wisps
      ctx.fillStyle = '#66aaff';
      ctx.fillRect(e.x - 1, e.y + 6, 2, 3);
      ctx.fillRect(e.x + e.w - 1, e.y + 5, 2, 4);
    } else if (e.type === 'shooter') {
      // Tengu-like yokai
      ctx.fillStyle = '#553322';
      ctx.fillRect(e.x + 1, e.y + 3, e.w - 2, e.h - 5);
      ctx.fillStyle = '#774433';
      ctx.fillRect(e.x + 3, e.y + 4, e.w - 6, 5);
      // Long nose
      const noseDir = e.dir || 1;
      ctx.fillStyle = '#aa6655';
      if (noseDir > 0) ctx.fillRect(e.x + e.w - 2, e.y + 5, 5, 2);
      else ctx.fillRect(e.x - 3, e.y + 5, 5, 2);
      // Eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x + 4, e.y + 3, 2, 2);
      ctx.fillRect(e.x + 8, e.y + 3, 2, 2);
      // Fan / staff
      ctx.fillStyle = '#cc4444';
      ctx.fillRect(e.x + (noseDir > 0 ? e.w - 1 : -4), e.y + 7, 4, 3);
    } else {
      // Oni / red demon walker
      ctx.fillStyle = '#cc2233';
      ctx.fillRect(e.x + 1, e.y + 4, e.w - 2, e.h - 6);
      ctx.fillStyle = '#ee4455';
      ctx.fillRect(e.x + 3, e.y + 5, e.w - 6, 4);
      // Horns
      ctx.fillStyle = '#aa1122';
      ctx.fillRect(e.x + 2, e.y, 2, 4);
      ctx.fillRect(e.x + e.w - 4, e.y, 2, 4);
      // Face
      ctx.fillStyle = '#ffddaa';
      ctx.fillRect(e.x + 4, e.y + 3, 6, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x + 5, e.y + 4, 1, 2);
      ctx.fillRect(e.x + 8, e.y + 4, 1, 2);
      // Legs
      const legOffset = Math.floor(Date.now() / 160 + e.x) % 2 === 0 ? 1 : 0;
      ctx.fillStyle = '#991122';
      ctx.fillRect(e.x + 2, e.y + e.h - 4 + legOffset, 3, 4);
      ctx.fillRect(e.x + e.w - 5, e.y + e.h - 4 + (1 - legOffset), 3, 4);
    }
  }

  // Bullets — ยันต์สำหรับผู้เล่น
  for (const b of bullets) {
    if (b.fromPlayer) {
      // ยันต์สีแดง
      ctx.fillStyle = '#ff2244';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
      ctx.fillStyle = '#ff4466';
      ctx.fillRect(b.x + 2, b.y + 1, 1, b.h - 2);
    } else {
      ctx.fillStyle = '#ff4455';
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  }

  // Player — Sprite based from reference sheet
  if (player.invincible % 5 < 3 || player.invincible === 0) {
    const isMoving = Math.abs(player.vx) > 0.1;
    const isJumping = !player.onGround;
    const isAttacking = player.singleTimer > 0 || player.tripleTimer > 0;
    const frame = Math.floor(Date.now() / 33) % 8;

    let sprite = sprites.idle[frame % sprites.idle.length];
    if (isAttacking) {
      sprite = sprites.attack[Math.floor(Date.now() / 33) % sprites.attack.length];
    } else if (isJumping) {
      sprite = sprites.jump[Math.floor(Date.now() / 33) % sprites.jump.length];
    } else if (isMoving) {
      sprite = sprites.run[frame % sprites.run.length];
    }

    if (sprite && sprite.complete) {
      ctx.save();
      if (player.facing < 0) {
        ctx.translate(player.x + player.w, player.y);
        ctx.scale(-1, 1);
        ctx.drawImage(sprite, 0, 0, player.w, player.h);
      } else {
        ctx.drawImage(sprite, player.x, player.y, player.w, player.h);
      }
      ctx.restore();
    } else {
      // Fallback simple draw if sprites not loaded
      ctx.fillStyle = '#dd2233';
      ctx.fillRect(player.x, player.y, player.w, player.h);
    }
  }

  // Particles
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life / 25);
    ctx.fillRect(p.x, p.y, 2, 2);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // ===== HUD สวยขึ้น =====
  // Health bar border
  ctx.fillStyle = '#112233';
  ctx.fillRect(6, 6, 92, 14);
  ctx.fillStyle = '#334455';
  ctx.fillRect(7, 7, 90, 12);
  // Health fill
  const hpW = 86 * (player.health / player.maxHealth);
  ctx.fillStyle = player.health > 14 ? '#44ff66' : player.health > 6 ? '#ffaa22' : '#ff3344';
  ctx.fillRect(9, 9, hpW, 8);
  // Pixel border highlight
  ctx.fillStyle = '#88aaff';
  ctx.fillRect(7, 7, 90, 1);
  ctx.fillRect(7, 7, 1, 12);

  ctx.fillStyle = '#fff';
  ctx.font = '7px monospace';
  ctx.fillText('SOLFMAN', 10, 16);
  ctx.fillStyle = '#88aaff';
  ctx.font = '6px monospace';
  ctx.fillText('Beta 0.009', 140, 16);

  // Weapon indicators
  ctx.fillStyle = player.singleTimer <= 0 ? '#ffff88' : '#555';
  ctx.fillRect(110, 8, 8, 8);
  ctx.fillStyle = '#000';
  ctx.font = '6px monospace';
  ctx.fillText('1', 112, 15);

  ctx.fillStyle = player.tripleTimer <= 0 ? '#ffee66' : '#555';
  ctx.fillRect(122, 8, 8, 8);
  ctx.fillStyle = '#000';
  ctx.fillText('3', 124, 15);

  // Boss warning
  if (scrollX > STAGE_END - 500 && !gameWon) {
    ctx.fillStyle = '#ff4466';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('!! BOSS AHEAD !!', canvas.width / 2, 28);
    ctx.textAlign = 'left';
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff4455';
    ctx.font = '18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 12);
    ctx.font = '10px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('กด R เพื่อเริ่มใหม่', canvas.width/2, canvas.height/2 + 8);
    ctx.textAlign = 'left';
  }

  if (gameWon) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#44ff88';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('STAGE CLEAR!!', canvas.width/2, canvas.height/2 - 12);
    ctx.font = '10px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('บอสถูกทำลายแล้ว! กด R เล่นใหม่', canvas.width/2, canvas.height/2 + 8);
    ctx.textAlign = 'left';
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
